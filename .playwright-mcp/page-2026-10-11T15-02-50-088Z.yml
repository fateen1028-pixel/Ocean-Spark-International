      - generic [ref=e120]:
        - generic [ref=e121]:
          - paragraph [ref=e122]: Origin
          - heading "It Starts In Southern Thailand." [level=2] [ref=e123]
          - paragraph [ref=e124]: Every consignment we supply begins as a coconut shell in Thailand — grown along the peninsula's Gulf coast, carbonised in earth kilns, and shipped to Chennai as a finished industrial fuel.
        - generic [ref=e125]:
          - paragraph [ref=e126]: "Shell charcoal is carbon, made the slow way: the shells are burned sealed against oxygen, at low heat, over several days. Low heat and a slow burn are what separate it from wood charcoal — it comes out harder, far cleaner, and it holds its heat long enough to carry a restaurant service or an industrial kiln. We buy whole, unbroken shells because they keep their shape through the burn and pack predictably into a sack."
          - paragraph [ref=e127]: The shells are a by-product of mills that already press the fruit for oil and milk. In India it lands as a bulk commodity and moves to distributors, wholesalers, restaurant suppliers and industrial fuel users. The growing and the burning are not ours; our part is knowing which grade suits which buyer, describing it honestly, and keeping the paperwork and the timetable moving around a shipment that has to actually arrive.
