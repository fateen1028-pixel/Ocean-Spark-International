    - generic [ref=e83]:
      - generic [ref=e84]:
        - generic [ref=e85]:
          - paragraph [ref=e86]: About Us
          - heading "An Import Business, Not A Middleman." [level=2] [ref=e87]
          - paragraph [ref=e88]: Ocean Spark International imports coconut shell charcoal from Thailand, lands it at Chennai and supplies it in bulk across Tamil Nadu. We sit between the kilns of the southern provinces and the distributors, wholesalers and industrial buyers who use the material — and our part is making that handover accurate.
        - generic [ref=e89]:
          - paragraph [ref=e90]: Moving charcoal between two countries runs on information. A buyer in India and a supplier in Thailand rarely share the same assumptions about grade, packaging, paperwork or timing. Most of the friction in this trade is not the product — it is the ambiguity around it.
          - paragraph [ref=e91]: "That is the part of the business we work on: stating what the product is, stating what has been checked, and saying plainly when something is still being confirmed. Every consignment is handled as one movement — supplier, freight, clearance, transport and delivery — so there is a single party answerable across the whole route. We are looking for commercial relationships that survive more than one shipment."
        - list [ref=e92]:
          - listitem [ref=e93]:
            - generic [ref=e96]: We buy in Thailand, land at Chennai and sell in India, so the description you receive is the description the cargo was loaded against.
          - listitem [ref=e97]:
            - generic [ref=e100]: Product information is shared in writing before commercial terms are agreed.
          - listitem [ref=e101]:
            - generic [ref=e104]: We work toward repeat business, which means clear communication matters more than a fast answer.
          - listitem [ref=e105]:
            - generic [ref=e108]: Bulk orders are handled as coordinated movements of goods, paperwork and timelines.
      - generic [ref=e109]:
        - figure [ref=e110]:
          - img "Stacks of filled woven sacks arranged in a warehouse, ready for bulk loading" [ref=e111]
        - paragraph [ref=e112]: Bulk quantities are configured against your packaging and loading requirements.
