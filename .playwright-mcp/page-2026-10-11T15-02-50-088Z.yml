    - generic [ref=e469]:
      - generic [ref=e471]:
        - paragraph [ref=e472]: FAQ
        - heading "Questions Buyers Ask." [level=2] [ref=e473]
        - paragraph [ref=e474]: Straight answers, including the ones we can only confirm per inquiry.
      - generic [ref=e476]:
        - generic [ref=e477]:
          - heading [level=3] [ref=e478]:
            - button "What is coconut shell charcoal?" [expanded] [ref=e479] [cursor=pointer]
          - region "What is coconut shell charcoal?" [ref=e484]:
            - paragraph [ref=e487]: Coconut shell charcoal is a hard charcoal produced by carbonising the hard shell of the coconut rather than the soft inner husk. Because the shell is a dense material, the resulting charcoal is heavier and harder than wood charcoal for a similar size, which is why it is widely used for grilling, BBQ and industrial fuel applications.
        - generic [ref=e488]:
          - heading [level=3] [ref=e489]:
            - button "Where does the charcoal come from?" [ref=e490] [cursor=pointer]
          - region "Where does the charcoal come from?":
            - paragraph [ref=e494]: Thailand. We buy from producers in the southern coconut belt — principally Chumphon, Surat Thani and Prachuap Khiri Khan — and import into India through Chennai.
        - generic [ref=e495]:
          - heading [level=3] [ref=e496]:
            - button "How does a shipment reach India?" [ref=e497] [cursor=pointer]
          - region "How does a shipment reach India?":
            - paragraph [ref=e501]: It moves as one coordinated chain. Material is prepared and containerised at the origin port in Thailand, moves by ocean freight to Chennai, is cleared there, and is then transported inland to your destination. You deal with a single party across the whole route rather than separate forwarders.
        - generic [ref=e502]:
          - heading [level=3] [ref=e503]:
            - button "What Incoterm do you quote on?" [ref=e504] [cursor=pointer]
          - region "What Incoterm do you quote on?":
            - paragraph [ref=e508]: CFR Chennai is the basis on which we quote. That means the quotation covers cost and freight to the Chennai port, with import clearance and inland transport arranged separately and stated as such. If you need a different basis for your own accounting, raise it in your inquiry and we will quote against it.
        - generic [ref=e509]:
          - heading [level=3] [ref=e510]:
            - button "How long does a shipment take?" [ref=e511] [cursor=pointer]
          - region "How long does a shipment take?":
            - paragraph [ref=e515]: Lead time is quoted per order rather than published, because it depends on the sailing schedule, port congestion, order size and your destination. Once we have your requirement, we confirm the expected timeline in writing along with the quotation.
        - generic [ref=e516]:
          - heading [level=3] [ref=e517]:
            - button "Do you supply whole shells or broken charcoal?" [ref=e518] [cursor=pointer]
          - region "Do you supply whole shells or broken charcoal?":
            - paragraph [ref=e522]: Whole, unbroken shell charcoal is the line we lead with. It keeps its shape through the burn, sheds fewer fines on handling and packs predictably into a sack, which matters when you are filling a container. Broken and graded charcoal is available for buyers who need a defined particle size. State which you need and we will confirm what can be supplied against your volume.
        - generic [ref=e523]:
          - heading [level=3] [ref=e524]:
            - button "What product forms are available?" [ref=e525] [cursor=pointer]
          - region "What product forms are available?":
            - paragraph [ref=e529]: "We list three product lines: coconut shell charcoal in lump form, formed briquettes, and industrial-grade coconut charcoal. Use the product filter on the inquiry form to indicate the form you are interested in, and we will confirm availability and specification for it."
        - generic [ref=e530]:
          - heading [level=3] [ref=e531]:
            - button "Can buyers request product specifications?" [ref=e532] [cursor=pointer]
          - region "Can buyers request product specifications?":
            - paragraph [ref=e536]: Yes. Request specifications through the inquiry form with your product of interest and indicative volume. Specification figures are shared against the grade being quoted rather than published as a general range, because they vary by batch and grade.
        - generic [ref=e537]:
          - heading [level=3] [ref=e538]:
            - button "How is quality checked?" [ref=e539] [cursor=pointer]
          - region "How is quality checked?":
            - paragraph [ref=e543]: Inspection points — form, grading, moisture and packaging — are agreed before the order is released. Third-party or pre-shipment inspection can be arranged before loading, and material is examined on arrival against the specification agreed at order. Any discrepancy is raised at that point rather than after the fact.
        - generic [ref=e544]:
          - heading [level=3] [ref=e545]:
            - button "Are bulk orders accepted?" [ref=e546] [cursor=pointer]
          - region "Are bulk orders accepted?":
            - paragraph [ref=e550]: Bulk inquiries are the core of the business. Include your estimated order quantity and destination in the inquiry form so the quotation can be prepared against the actual movement rather than a generic price list.
        - generic [ref=e551]:
          - heading [level=3] [ref=e552]:
            - button "Which packaging options are available?" [ref=e553] [cursor=pointer]
          - region "Which packaging options are available?":
            - paragraph [ref=e557]: Packaging is confirmed per order against form, quantity and destination. State your packaging preference in the inquiry form and we will confirm what can be arranged for that shipment.
        - generic [ref=e558]:
          - heading [level=3] [ref=e559]:
            - button "What are your payment terms?" [ref=e560] [cursor=pointer]
          - region "What are your payment terms?":
            - paragraph [ref=e564]: Payment terms are agreed in writing per order and are not published, because they depend on the buyer, the volume and the commercial terms of the quotation. They are stated on the quotation itself, so there is no ambiguity about what applies to your order.
        - generic [ref=e565]:
          - heading [level=3] [ref=e566]:
            - button "How can I request a quotation?" [ref=e567] [cursor=pointer]
          - region "How can I request a quotation?":
            - paragraph [ref=e571]: Use the inquiry form on this page. The more detail you provide — product form, quantity, packaging preference and destination — the more specific the quotation can be. You will get a response that either answers the question or tells you what is still being confirmed.
