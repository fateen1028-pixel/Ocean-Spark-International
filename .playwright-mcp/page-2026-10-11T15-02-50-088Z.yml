          - region "Which countries and ports can the company serve?":
            - paragraph [ref=e578]: India is our base market, supplied through Chennai into Tamil Nadu and wider India. Destinations beyond that are confirmed case by case against quantity and the commercial terms agreed. Provide your destination port in the inquiry form and we will confirm what is workable for that route.
        - generic [ref=e579]:
