    - generic [ref=e219]:
      - generic [ref=e221]:
        - paragraph [ref=e222]: Why Work With Us
        - heading "Trade With Confidence." [level=2] [ref=e223]
        - paragraph [ref=e224]: Four things we treat as part of the product, not an extra. Each one exists because a cross-border buyer cannot see or verify anything until the cargo arrives.
      - list [ref=e226]:
        - listitem [ref=e227]:
          - paragraph [aria-hidden] [ref=e228]: "01"
          - heading "One Trade Chain, Not Dropped Links" [level=3] [ref=e229]
          - paragraph [ref=e230]: Supplier, ocean freight, Chennai clearance, inland transport and delivery are coordinated as a single movement, so you are dealing with one party across the whole route.
        - listitem [ref=e231]:
          - paragraph [aria-hidden] [ref=e232]: "02"
          - heading "Product Information" [level=3] [ref=e233]
          - paragraph [ref=e234]: Specifications, form, grade and packaging are set out in writing before a quotation is issued, so both sides quote from the same document.
        - listitem [ref=e235]:
          - paragraph [aria-hidden] [ref=e236]: "03"
          - heading "Inspection Before Rejection" [level=3] [ref=e237]
          - paragraph [ref=e238]: Quality is checked at agreed points so material can be examined before it is committed, rather than disputed after it arrives.
        - listitem [ref=e239]:
          - paragraph [aria-hidden] [ref=e240]: "04"
          - heading "Responsive Communication" [level=3] [ref=e241]
          - paragraph [ref=e242]: Enquiries receive a clear answer about what is available and what is still being confirmed, rather than a delay without explanation.
    - generic [ref=e244]:
