        - generic [ref=e246]:
          - paragraph [ref=e247]: Quality & Inspection
          - heading "Know What You're Buying." [level=2] [ref=e248]
          - paragraph [ref=e249]: Charcoal is not a standardised product the way a manufactured component is. Two shipments of the same nominal grade can differ. The job of a supplier is to make those differences explicit rather than let a buyer discover them at discharge.
        - list [ref=e250]:
          - listitem [ref=e251]:
            - generic [ref=e254]: Inspection points are agreed before the order is released — form, grading, moisture and packaging — so you know what is being checked and when.
          - listitem [ref=e255]:
            - generic [ref=e258]: Third-party or pre-shipment inspection can be arranged before loading, so material is assessed before it is committed rather than after it arrives.
          - listitem [ref=e259]:
            - generic [ref=e262]: Material is examined on arrival against the specification agreed at order, and any discrepancy is raised at that point rather than after the fact.
          - listitem [ref=e263]:
            - generic [ref=e266]: Import, clearance and shipping documents are supplied with each consignment, so the paperwork behind the cargo is available to your own team.
          - listitem [ref=e267]:
            - generic [ref=e270]: Specification figures are issued per grade against the quotation, so the numbers you receive match the cargo you buy.
        - generic [ref=e271]:
