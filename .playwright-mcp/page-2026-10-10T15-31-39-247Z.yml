    - generic [ref=f48e196]:
      - generic [ref=f48e198]:
        - paragraph [ref=f48e199]: Why Work With Us
        - heading "Trade With Confidence." [level=2] [ref=f48e200]
        - paragraph [ref=f48e201]: Four things we treat as part of the product, not an extra. Each one exists because a cross-border buyer cannot see or verify anything until the cargo arrives.
      - list [ref=f48e203]:
        - listitem [ref=f48e204]:
          - paragraph [aria-hidden] [ref=f48e205]: "01"
          - heading "Sourcing Transparency" [level=3] [ref=f48e206]
          - paragraph [ref=f48e207]: You are told where a shipment originates and what was checked before it was offered, so you can assess the supply instead of taking it on trust.
        - listitem [ref=f48e208]:
          - paragraph [aria-hidden] [ref=f48e209]: "02"
          - heading "Product Information" [level=3] [ref=f48e210]
          - paragraph [ref=f48e211]: Specifications, form, grade and packaging are set out in writing before a quotation is issued, so both sides quote from the same document.
        - listitem [ref=f48e212]:
          - paragraph [aria-hidden] [ref=f48e213]: "03"
          - heading "Bulk Order Coordination" [level=3] [ref=f48e214]
          - paragraph [ref=f48e215]: Order volume, packaging configuration and loading arrangements are agreed up front, and confirmed back to you in writing.
        - listitem [ref=f48e216]:
          - paragraph [aria-hidden] [ref=f48e217]: "04"
          - heading "Responsive Communication" [level=3] [ref=f48e218]
          - paragraph [ref=f48e219]: Enquiries receive a clear answer about what is available and what is still being confirmed, rather than a delay without explanation.
    - generic [ref=f48e221]:
      - generic [ref=f48e222]:
        - generic [ref=f48e223]:
          - paragraph [ref=f48e224]: Quality & Sourcing
          - heading "Know What You're Buying." [level=2] [ref=f48e225]
          - paragraph [ref=f48e226]: Charcoal is not a standardised product the way a manufactured component is. Two shipments of the same nominal grade can differ. The job of a supplier is to make those differences explicit rather than let a buyer discover them at discharge.
        - list [ref=f48e227]:
          - listitem [ref=f48e228]:
            - generic [ref=f48e231]: Specification figures are issued per grade against the quotation, so the numbers you receive match the cargo you buy.
          - listitem [ref=f48e232]:
            - generic [ref=f48e235]: Packaging configuration is agreed in writing before production, including bag weight and stacking arrangement.
          - listitem [ref=f48e236]:
            - generic [ref=f48e239]: Inspection points — form, grading, moisture check, packaging — are defined before the order is released.
          - listitem [ref=f48e240]:
            - generic [ref=f48e243]: Order requirements are restated back to you in writing, so both sides work from the same document.
        - generic [ref=f48e244]:
          - paragraph [ref=f48e245]: Documentation
          - paragraph [ref=f48e246]: These documents are released per shipment once prepared and approved. Request them with your inquiry and we will confirm which apply to your order.
