      - generic [ref=f48e95]:
        - generic [ref=f48e96]:
          - paragraph [ref=f48e97]: About Us
          - heading "Built Around Reliable Trade." [level=2] [ref=f48e98]
          - paragraph [ref=f48e99]: Ocean Spark International is a sourcing and trading business focused on coconut shell charcoal. We connect buyers who need dependable supply with product that is described accurately before any commitment is made.
        - generic [ref=f48e100]:
          - paragraph [ref=f48e101]: International commodity trade runs on information. A buyer in one market and a supplier in another rarely share the same assumptions about grade, packaging, paperwork or timing. Most of the friction in this trade is not the product — it is the ambiguity around it.
          - paragraph [ref=f48e102]: "That is the part of the business we work on: stating what the product is, stating what has been checked, and saying plainly when something is still being confirmed. We are looking for commercial relationships that survive more than one shipment."
        - list [ref=f48e103]:
          - listitem [ref=f48e104]:
            - generic [ref=f48e107]: Sourcing is matched to the specification a buyer actually needs, not to whatever is easiest to ship.
          - listitem [ref=f48e108]:
            - generic [ref=f48e111]: Product information is shared in writing before commercial terms are agreed.
          - listitem [ref=f48e112]:
            - generic [ref=f48e115]: We work toward repeat business, which means clear communication matters more than a fast answer.
          - listitem [ref=f48e116]:
            - generic [ref=f48e119]: Bulk orders are handled as coordinated movements of goods, paperwork and timelines.
      - generic [ref=f48e120]:
        - figure [ref=f48e121]:
          - img "Stacks of filled woven sacks arranged in a warehouse, ready for bulk loading" [ref=f48e122]
        - paragraph [ref=f48e123]: Bulk quantities are configured against your packaging and loading requirements.
