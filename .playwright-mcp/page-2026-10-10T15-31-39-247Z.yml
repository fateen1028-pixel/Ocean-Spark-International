      - generic [ref=f48e415]:
        - generic [ref=f48e416]:
          - heading [level=3] [ref=f48e417]:
            - button "What is coconut shell charcoal?" [expanded] [ref=f48e418] [cursor=pointer]
          - region "What is coconut shell charcoal?" [ref=f48e423]:
            - paragraph [ref=f48e426]: Coconut shell charcoal is a hard charcoal produced by carbonising the hard shell of the coconut rather than the soft inner husk. Because the shell is a dense material, the resulting charcoal is heavier and harder than wood charcoal for a similar size, which is why it is widely used for grilling, BBQ and industrial fuel applications.
        - generic [ref=f48e427]:
          - heading [level=3] [ref=f48e428]:
            - button "What product forms are available?" [ref=f48e429] [cursor=pointer]
          - region "What product forms are available?":
            - paragraph [ref=f48e433]: "We list three product lines: coconut shell charcoal in lump form, formed briquettes, and industrial-grade coconut charcoal. Use the product filter on the inquiry form to indicate the form you are interested in, and we will confirm availability and specification for it."
        - generic [ref=f48e434]:
          - heading [level=3] [ref=f48e435]:
            - button "Can buyers request product specifications?" [ref=f48e436] [cursor=pointer]
          - region "Can buyers request product specifications?":
            - paragraph [ref=f48e440]: Yes. Request specifications through the inquiry form with your product of interest and indicative volume. Specification figures are shared against the grade being quoted rather than published as a general range, because they vary by batch and grade.
        - generic [ref=f48e441]:
          - heading [level=3] [ref=f48e442]:
            - button "Are bulk orders accepted?" [ref=f48e443] [cursor=pointer]
          - region "Are bulk orders accepted?":
            - paragraph [ref=f48e447]: Bulk inquiries are the core of the business. Include your estimated order quantity and destination in the inquiry form so the quotation can be prepared against the actual movement rather than a generic price list.
        - generic [ref=f48e448]:
