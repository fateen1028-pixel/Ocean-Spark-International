      - generic [ref=f5e126]:
        - generic [ref=f5e127]:
          - paragraph [ref=f5e128]: Origin
          - heading "It Starts In Southern Thailand." [level=2] [ref=f5e129]
          - paragraph [ref=f5e130]: Every tonne we supply begins as a coconut shell in Thailand — grown along the peninsula's Gulf coast, carbonised in earth kilns, and shipped to India as a finished industrial fuel.
        - generic [ref=f5e131]:
          - paragraph [ref=f5e132]: "Shell charcoal is carbon, made the slow way: the shells are burned sealed against oxygen, at low heat, over several days. Low heat and a slow burn are what separate it from wood charcoal — it comes out harder, far cleaner, and it holds its heat long enough to carry a restaurant service or an industrial kiln."
          - paragraph [ref=f5e133]: We buy whole, unbroken shells. They keep their shape through the burn, shed fewer fines on handling, and pack predictably into a sack, which matters when the buyer is filling a container. The shells are a by-product of mills that already press the fruit for oil and milk — the coconut has been used for everything else long before it reaches a kiln.
          - paragraph [ref=f5e134]: In India it lands as a bulk commodity and moves to distributors, wholesalers, restaurant suppliers and industrial fuel users. The growing and the burning are not ours. Our part is knowing which grade suits which buyer, describing it honestly, and keeping the paperwork and the timetable moving around a shipment that has to actually arrive.
