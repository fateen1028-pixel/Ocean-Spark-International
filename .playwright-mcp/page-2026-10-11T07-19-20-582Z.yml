      - generic [ref=f5e225]:
        - paragraph [ref=f5e226]: Why Work With Us
        - heading "Trade With Confidence." [level=2] [ref=f5e227]
        - paragraph [ref=f5e228]: Four things we treat as part of the product, not an extra. Each one exists because a cross-border buyer cannot see or verify anything until the cargo arrives.
      - list [ref=f5e230]:
        - listitem [ref=f5e231]:
          - paragraph [aria-hidden] [ref=f5e232]: "01"
          - heading "Sourcing Transparency" [level=3] [ref=f5e233]
          - paragraph [ref=f5e234]: You are told where a shipment originates and what was checked before it was offered, so you can assess the supply instead of taking it on trust.
        - listitem [ref=f5e235]:
          - paragraph [aria-hidden] [ref=f5e236]: "02"
          - heading "Product Information" [level=3] [ref=f5e237]
          - paragraph [ref=f5e238]: Specifications, form, grade and packaging are set out in writing before a quotation is issued, so both sides quote from the same document.
        - listitem [ref=f5e239]:
          - paragraph [aria-hidden] [ref=f5e240]: "03"
          - heading "Bulk Order Coordination" [level=3] [ref=f5e241]
          - paragraph [ref=f5e242]: Order volume, packaging configuration and loading arrangements are agreed up front, and confirmed back to you in writing.
        - listitem [ref=f5e243]:
          - paragraph [aria-hidden] [ref=f5e244]: "04"
          - heading "Responsive Communication" [level=3] [ref=f5e245]
          - paragraph [ref=f5e246]: Enquiries receive a clear answer about what is available and what is still being confirmed, rather than a delay without explanation.
    - generic [ref=f5e248]:
