          - heading "Know What You're Buying." [level=2] [ref=f5e252]
          - paragraph [ref=f5e253]: Charcoal is not a standardised product the way a manufactured component is. Two shipments of the same nominal grade can differ. The job of a supplier is to make those differences explicit rather than let a buyer discover them at discharge.
