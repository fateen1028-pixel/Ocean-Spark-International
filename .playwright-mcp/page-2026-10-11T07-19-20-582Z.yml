    - generic [ref=f5e89]:
      - generic [ref=f5e90]:
        - generic [ref=f5e91]:
          - paragraph [ref=f5e92]: About Us
          - heading "Built Around Reliable Trade." [level=2] [ref=f5e93]
          - paragraph [ref=f5e94]: Ocean Spark International imports coconut shell charcoal from Thailand and supplies it in bulk across India. We sit between the kilns of the southern provinces and the distributors, wholesalers and industrial buyers who use the material — and our part is making that handover accurate.
        - generic [ref=f5e95]:
          - paragraph [ref=f5e96]: Moving charcoal between two countries runs on information. A buyer in India and a supplier in Thailand rarely share the same assumptions about grade, packaging, paperwork or timing. Most of the friction in this trade is not the product — it is the ambiguity around it.
          - paragraph [ref=f5e97]: "That is the part of the business we work on: stating what the product is, stating what has been checked, and saying plainly when something is still being confirmed. We are looking for commercial relationships that survive more than one shipment."
        - list [ref=f5e98]:
          - listitem [ref=f5e99]:
            - generic [ref=f5e102]: We buy in Thailand and sell in India, so the description you receive is the description the cargo was loaded against.
          - listitem [ref=f5e103]:
            - generic [ref=f5e106]: Product information is shared in writing before commercial terms are agreed.
          - listitem [ref=f5e107]:
            - generic [ref=f5e110]: We work toward repeat business, which means clear communication matters more than a fast answer.
          - listitem [ref=f5e111]:
            - generic [ref=f5e114]: Bulk orders are handled as coordinated movements of goods, paperwork and timelines.
      - generic [ref=f5e115]:
        - figure [ref=f5e116]:
          - img "Stacks of filled woven sacks arranged in a warehouse, ready for bulk loading" [ref=f5e117]
        - paragraph [ref=f5e118]: Bulk quantities are configured against your packaging and loading requirements.
    - generic [ref=f5e120]:
      - generic [ref=f5e121]:
        - figure [ref=f5e122]:
