    - generic [ref=f5e435]:
      - generic [ref=f5e437]:
        - paragraph [ref=f5e438]: FAQ
        - heading "Questions Buyers Ask." [level=2] [ref=f5e439]
        - paragraph [ref=f5e440]: Straight answers, including the ones we can only confirm per inquiry.
      - generic [ref=f5e442]:
        - generic [ref=f5e443]:
          - heading [level=3] [ref=f5e444]:
            - button "What is coconut shell charcoal?" [expanded] [ref=f5e445] [cursor=pointer]
          - region "What is coconut shell charcoal?" [ref=f5e450]:
            - paragraph [ref=f5e453]: Coconut shell charcoal is a hard charcoal produced by carbonising the hard shell of the coconut rather than the soft inner husk. Because the shell is a dense material, the resulting charcoal is heavier and harder than wood charcoal for a similar size, which is why it is widely used for grilling, BBQ and industrial fuel applications.
        - generic [ref=f5e454]:
          - heading [level=3] [ref=f5e455]:
            - button "Where does the charcoal come from?" [ref=f5e456] [cursor=pointer]
          - region "Where does the charcoal come from?":
            - paragraph [ref=f5e460]: Thailand. We buy from producers in the southern coconut belt — principally Chumphon, Surat Thani and Prachuap Khiri Khan — and import into India for wholesale and distribution.
        - generic [ref=f5e461]:
          - heading [level=3] [ref=f5e462]:
            - button "Do you supply whole shells or broken charcoal?" [ref=f5e463] [cursor=pointer]
          - region "Do you supply whole shells or broken charcoal?":
            - paragraph [ref=f5e467]: Whole, unbroken shell charcoal is the line we lead with. It keeps its shape through the burn, sheds fewer fines on handling and packs predictably into a sack, which matters when you are filling a container. Broken and graded charcoal is available for buyers who need a defined particle size. State which you need and we will confirm what can be supplied against your volume.
        - generic [ref=f5e468]:
          - heading [level=3] [ref=f5e469]:
            - button "What product forms are available?" [ref=f5e470] [cursor=pointer]
          - region "What product forms are available?":
            - paragraph [ref=f5e474]: "We list three product lines: coconut shell charcoal in lump form, formed briquettes, and industrial-grade coconut charcoal. Use the product filter on the inquiry form to indicate the form you are interested in, and we will confirm availability and specification for it."
        - generic [ref=f5e475]:
          - heading [level=3] [ref=f5e476]:
            - button "Can buyers request product specifications?" [ref=f5e477] [cursor=pointer]
          - region "Can buyers request product specifications?":
            - paragraph [ref=f5e481]: Yes. Request specifications through the inquiry form with your product of interest and indicative volume. Specification figures are shared against the grade being quoted rather than published as a general range, because they vary by batch and grade.
        - generic [ref=f5e482]:
          - heading [level=3] [ref=f5e483]:
            - button "Are bulk orders accepted?" [ref=f5e484] [cursor=pointer]
          - region "Are bulk orders accepted?":
            - paragraph [ref=f5e488]: Bulk inquiries are the core of the business. Include your estimated order quantity and destination in the inquiry form so the quotation can be prepared against the actual movement rather than a generic price list.
